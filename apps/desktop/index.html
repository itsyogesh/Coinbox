<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coinbox</title>

    <link rel="icon" type="image/svg+xml" href="/src/assets/finance/mark.svg" />

    <!-- Prevent flash of unstyled content - default to dark -->
    <script>
      (function () {
        const theme = localStorage.getItem("coinbox-theme");
        // Default to dark mode for premium finance aesthetic
        if (theme === "light") {
          document.documentElement.classList.remove("dark");
        } else {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <style>
      /* Prevent FOUC */
      html {
        background-color: #fafafa;
      }
      html.dark {
        background-color: #161918;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
