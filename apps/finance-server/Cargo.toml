[package]
name = "coinbox-finance-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
coinbox-finance = { path = "../../packages/finance" }
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["fs"] }
zeroize = "1"
