[package]
name = "coinbox-finance"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = "0.4"
calamine = { version = "0.35", features = ["chrono"] }
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
